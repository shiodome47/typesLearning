name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # 教材コードはテンプレート文字列で tsc の対象外のため、
      # 専用ハーネスで型チェックと採点仕様の正しさを検証する
      - name: Verify curriculum
        run: npm run verify:curriculum

      - name: Build
        run: npm run build
